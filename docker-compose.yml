# Local Postgres for development.  `docker compose up -d`  then  `npm run setup`.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: layers
    ports:
      - "5432:5432"
    volumes:
      - layers_pgdata:/var/lib/postgresql/data

volumes:
  layers_pgdata:
